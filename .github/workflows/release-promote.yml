name: Signed Release Promotion & Air-Gapped Bundle

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-rc.[0-9]+"
  workflow_dispatch:
    inputs:
      release_version:
        description: "Semantic version to promote (e.g. 1.1.0 or 1.0.0)"
        required: true
        type: string
      source_git_sha:
        description: "Verified 7-char Git SHA image tag from staging"
        required: true
        type: string

permissions:
  contents: write
  packages: write
  id-token: write

env:
  REGISTRY: ghcr.io

jobs:
  promote-and-package-offline-bundle:
    name: "Build Standalone JARs, Dual-WAR, Linux Installers (.deb/.rpm/.tar.gz) & Air-Gapped Bundle"
    runs-on: ubuntu-latest
    environment: production
    outputs:
      semver: ${{ steps.rel.outputs.semver }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: Install Linux Packaging Tools (fakeroot, rpm, zstd)
        run: sudo apt-get update && sudo apt-get install -y fakeroot rpm zstd

      - name: Resolve Release Version
        id: rel
        run: |
          if [[ -n "${{ inputs.release_version }}" ]]; then
            VER="${{ inputs.release_version }}"
          else
            VER="${GITHUB_REF_NAME#v}"
          fi
          echo "semver=${VER}" >> "$GITHUB_OUTPUT"

      - name: Run Release Hygiene, Confinement & Zero-Licensing Gates
        run: |
          python3 tools/verify_manifest.py --self-test
          python3 tools/verify_manifest.py --phase g0-bootstrap --mode after
          python3 tools/verify_manifest.py
          python3 tools/verify_flyway_backward_compat.py
          python3 tools/check_zero_licensing.py

      - name: Build Portable Dual-WAR, Standalone Reader & Self-Contained Java Swing Desktop JAR
        run: mvn -B -pl reader,server,desktop -am package -DskipTests -DskipITs=true

      - name: Build Native Linux Desktop Installers (.deb, .rpm, .tar.gz)
        run: |
          chmod +x deploy/linux/build-linux-installer.sh
          ./deploy/linux/build-linux-installer.sh --app-version "${{ steps.rel.outputs.semver }}" --arch x64 --skip-maven-tests

      - name: Verify Dual-WAR Swing/Desktop Isolation & Standalone JAR Smoke Probe (SWG-002 / DEP-003)
        run: |
          VER="${{ steps.rel.outputs.semver }}"
          jar tf server/target/moneycraft.war > /tmp/war-entries.txt
          if grep -E "com/raster/moneycraft/desktop/|javax/swing/|java/awt/print/" /tmp/war-entries.txt; then
            echo "DEP-003/SWG-002 violation: desktop or Swing classes found inside moneycraft.war" >&2
            exit 1
          fi
          cp desktop/target/moneycraft-desktop.jar "MoneyCraft-Desktop-${VER}.jar"
          cp reader/target/moneycraft-reader.jar "MoneyCraft-Reader-${VER}.jar"
          cp server/target/moneycraft.war "moneycraft-${VER}.war"
          OUT="$(java -jar "MoneyCraft-Desktop-${VER}.jar" --api-ip 127.0.0.1 --api-port 8443 --verify-theme)"
          echo "${OUT}"
          if [[ "${OUT}" != *"MoneyCraft Desktop 1.0.0 ready"* ]]; then
            echo "Standalone Desktop JAR smoke probe failed: ${OUT}" >&2
            exit 1
          fi
          sha256sum "MoneyCraft-Desktop-${VER}.jar" "MoneyCraft-Reader-${VER}.jar" "moneycraft-${VER}.war" > SHA256SUMS-jars-and-war.txt

      - name: Install Cosign for Supply-Chain Attestation
        uses: sigstore/cosign-installer@v3.7.0

      - name: Assemble Air-Gapped Private-LAN Release Bundle (DEP-001)
        run: |
          VER="${{ steps.rel.outputs.semver }}"
          BUNDLE_DIR="moneycraft-release-v${VER}"
          mkdir -p "${BUNDLE_DIR}/artifacts/desktop-lib" "${BUNDLE_DIR}/deploy/windows" "${BUNDLE_DIR}/deploy/macos" "${BUNDLE_DIR}/deploy/linux" "${BUNDLE_DIR}/deployment" "${BUNDLE_DIR}/openapi"

          cp reader/target/moneycraft-reader.jar "${BUNDLE_DIR}/artifacts/"
          cp server/target/moneycraft.war "${BUNDLE_DIR}/artifacts/"
          cp desktop/target/moneycraft-desktop.jar "${BUNDLE_DIR}/artifacts/"
          cp desktop/target/lib/*.jar "${BUNDLE_DIR}/artifacts/desktop-lib/"
          cp server/src/main/resources/openapi/moneycraft-v1.yaml "${BUNDLE_DIR}/openapi/"
          cp docker-compose.yml docker-compose.staging.yml docker-compose.prod.yml .env.staging.example .env.prod.example CHANGELOG.md README.md "${BUNDLE_DIR}/"
          cp deploy/*.sh "${BUNDLE_DIR}/deploy/"
          cp deploy/windows/*.ps1 "${BUNDLE_DIR}/deploy/windows/"
          cp deploy/macos/*.sh "${BUNDLE_DIR}/deploy/macos/"
          cp deploy/linux/*.sh "${BUNDLE_DIR}/deploy/linux/"
          cp -R deployment/* "${BUNDLE_DIR}/deployment/"

          (
            cd "${BUNDLE_DIR}"
            find . -type f -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS.txt
          )

          tar --zstd -cf "moneycraft-release-v${VER}-offline.tar.zst" "${BUNDLE_DIR}"
          sha256sum "moneycraft-release-v${VER}-offline.tar.zst" > "moneycraft-release-v${VER}-offline.tar.zst.sha256"

      - name: Upload Signed Offline Release Bundle, Standalone JARs/WAR & Linux Installers
        uses: actions/upload-artifact@v4
        with:
          name: moneycraft-release-v${{ steps.rel.outputs.semver }}-linux-and-jars
          path: |
            MoneyCraft-Desktop-${{ steps.rel.outputs.semver }}.jar
            MoneyCraft-Reader-${{ steps.rel.outputs.semver }}.jar
            moneycraft-${{ steps.rel.outputs.semver }}.war
            SHA256SUMS-jars-and-war.txt
            desktop/target/installer/MoneyCraft-Desktop-${{ steps.rel.outputs.semver }}-linux-x64.deb
            desktop/target/installer/MoneyCraft-Desktop-${{ steps.rel.outputs.semver }}-linux-x64.rpm
            desktop/target/installer/MoneyCraft-Desktop-${{ steps.rel.outputs.semver }}-linux-x64.tar.gz
            desktop/target/installer/SHA256SUMS-linux.txt
            moneycraft-release-v${{ steps.rel.outputs.semver }}-offline.tar.zst
            moneycraft-release-v${{ steps.rel.outputs.semver }}-offline.tar.zst.sha256

      - name: Publish Standalone JARs, WAR, Linux Installers & Offline Bundle to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          prerelease: ${{ contains(github.ref_name, '-rc.') }}
          generate_release_notes: true
          files: |
            MoneyCraft-Desktop-${{ steps.rel.outputs.semver }}.jar
            MoneyCraft-Reader-${{ steps.rel.outputs.semver }}.jar
            moneycraft-${{ steps.rel.outputs.semver }}.war
            SHA256SUMS-jars-and-war.txt
            desktop/target/installer/MoneyCraft-Desktop-${{ steps.rel.outputs.semver }}-linux-x64.deb
            desktop/target/installer/MoneyCraft-Desktop-${{ steps.rel.outputs.semver }}-linux-x64.rpm
            desktop/target/installer/MoneyCraft-Desktop-${{ steps.rel.outputs.semver }}-linux-x64.tar.gz
            desktop/target/installer/SHA256SUMS-linux.txt
            deploy/linux/build-linux-installer.sh
            moneycraft-release-v${{ steps.rel.outputs.semver }}-offline.tar.zst
            moneycraft-release-v${{ steps.rel.outputs.semver }}-offline.tar.zst.sha256

  package-macos-desktop-release:
    name: "Package & Attach macOS arm64 Swing Desktop Installers (.dmg + .pkg + .app.zip)"
    needs: promote-and-package-offline-bundle
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: Build Stripped Java 25 jlink Runtime & macOS .dmg/.pkg/.app.zip Installers
        run: |
          chmod +x deploy/macos/build-macos-installer.sh
          ./deploy/macos/build-macos-installer.sh --app-version "${{ needs.promote-and-package-offline-bundle.outputs.semver }}" --arch arm64 --skip-maven-tests

      - name: Smoke-Verify macOS Standalone Desktop JAR
        run: |
          OUT="$(java -jar desktop/target/moneycraft-desktop.jar --api-ip 192.168.1.100 --api-port 8443 --verify-theme)"
          echo "${OUT}"
          if [[ "${OUT}" != *"MoneyCraft Desktop 1.0.0 ready"* ]]; then
            echo "macOS desktop launcher smoke verification failed: ${OUT}" >&2
            exit 1
          fi

      - name: Upload macOS Desktop Release Installers
        uses: actions/upload-artifact@v4
        with:
          name: moneycraft-desktop-v${{ needs.promote-and-package-offline-bundle.outputs.semver }}-macos-arm64
          path: |
            desktop/target/installer/MoneyCraft-Desktop-${{ needs.promote-and-package-offline-bundle.outputs.semver }}-macos-arm64.dmg
            desktop/target/installer/MoneyCraft-Desktop-${{ needs.promote-and-package-offline-bundle.outputs.semver }}-macos-arm64.pkg
            desktop/target/installer/MoneyCraft-Desktop-${{ needs.promote-and-package-offline-bundle.outputs.semver }}-macos-arm64-app.zip
            desktop/target/installer/SHA256SUMS-macos.txt
            deploy/macos/build-macos-installer.sh

      - name: Attach macOS Installers to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            desktop/target/installer/MoneyCraft-Desktop-${{ needs.promote-and-package-offline-bundle.outputs.semver }}-macos-arm64.dmg
            desktop/target/installer/MoneyCraft-Desktop-${{ needs.promote-and-package-offline-bundle.outputs.semver }}-macos-arm64.pkg
            desktop/target/installer/MoneyCraft-Desktop-${{ needs.promote-and-package-offline-bundle.outputs.semver }}-macos-arm64-app.zip
            desktop/target/installer/SHA256SUMS-macos.txt
            deploy/macos/build-macos-installer.sh

  package-windows-desktop-release:
    name: "Package & Attach Windows x64 Swing Desktop Installers (.msi + .exe)"
    needs: promote-and-package-offline-bundle
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: Build Stripped Java 25 jlink Runtime & Windows .msi/.exe Installers
        shell: pwsh
        run: ./deploy/windows/build-windows-installer.ps1 -AppVersion "${{ needs.promote-and-package-offline-bundle.outputs.semver }}" -Architecture x64 -SkipMavenTests

      - name: Upload Windows Desktop Release Installers
        uses: actions/upload-artifact@v4
        with:
          name: moneycraft-desktop-v${{ needs.promote-and-package-offline-bundle.outputs.semver }}-windows-x64
          path: |
            desktop/target/installer/MoneyCraft-Desktop-${{ needs.promote-and-package-offline-bundle.outputs.semver }}-windows-x64.msi
            desktop/target/installer/MoneyCraft-Desktop-${{ needs.promote-and-package-offline-bundle.outputs.semver }}-windows-x64.exe
            desktop/target/installer/SHA256SUMS-windows.txt
            deploy/windows/install-moneycraft-windows.ps1

      - name: Attach Windows Installers to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            desktop/target/installer/MoneyCraft-Desktop-${{ needs.promote-and-package-offline-bundle.outputs.semver }}-windows-x64.msi
            desktop/target/installer/MoneyCraft-Desktop-${{ needs.promote-and-package-offline-bundle.outputs.semver }}-windows-x64.exe
            desktop/target/installer/SHA256SUMS-windows.txt
            deploy/windows/install-moneycraft-windows.ps1
