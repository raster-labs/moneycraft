name: Signed Release Promotion & Air-Gapped Bundle

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-rc.[0-9]+"
  workflow_dispatch:
    inputs:
      release_version:
        description: "Semantic version to promote (e.g. 1.0.0)"
        required: true
        type: string
      source_git_sha:
        description: "Verified 7-char Git SHA image tag from staging"
        required: true
        type: string

permissions:
  contents: write
  packages: write
  id-token: write

env:
  REGISTRY: ghcr.io

jobs:
  promote-and-package-offline-bundle:
    name: "Promote Digest-Verified OCI Images & Build Air-Gapped .tar.zst Bundle"
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: Resolve Release Version
        id: rel
        run: |
          if [[ -n "${{ inputs.release_version }}" ]]; then
            VER="${{ inputs.release_version }}"
          else
            VER="${GITHUB_REF_NAME#v}"
          fi
          echo "semver=${VER}" >> "$GITHUB_OUTPUT"

      - name: Run Release Hygiene & Zero-Licensing Gates
        run: |
          python3 tools/verify_manifest.py
          python3 tools/verify_flyway_backward_compat.py
          python3 tools/check_zero_licensing.py

      - name: Build Portable Dual-WAR & Standalone Reader Artifacts
        run: mvn -B -pl reader,server -am package -DskipTests -DskipITs=true

      - name: Install Cosign for Supply-Chain Attestation
        uses: sigstore/cosign-installer@v3.7.0

      - name: Assemble Air-Gapped Private-LAN Release Bundle (DEP-001)
        run: |
          VER="${{ steps.rel.outputs.semver }}"
          BUNDLE_DIR="moneycraft-release-v${VER}"
          mkdir -p "${BUNDLE_DIR}/artifacts" "${BUNDLE_DIR}/deploy" "${BUNDLE_DIR}/deployment"

          cp reader/target/moneycraft-reader.jar "${BUNDLE_DIR}/artifacts/"
          cp server/target/moneycraft.war "${BUNDLE_DIR}/artifacts/"
          cp docker-compose.yml docker-compose.prod.yml .env.prod.example CHANGELOG.md README.md "${BUNDLE_DIR}/"
          cp deploy/*.sh "${BUNDLE_DIR}/deploy/"
          cp -R deployment/* "${BUNDLE_DIR}/deployment/"

          (
            cd "${BUNDLE_DIR}"
            find . -type f -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS.txt
          )

          tar --zstd -cf "moneycraft-release-v${VER}-offline.tar.zst" "${BUNDLE_DIR}"
          sha256sum "moneycraft-release-v${VER}-offline.tar.zst" > "moneycraft-release-v${VER}-offline.tar.zst.sha256"

      - name: Upload Signed Offline Release Bundle
        uses: actions/upload-artifact@v4
        with:
          name: moneycraft-release-v${{ steps.rel.outputs.semver }}-offline
          path: |
            moneycraft-release-v${{ steps.rel.outputs.semver }}-offline.tar.zst
            moneycraft-release-v${{ steps.rel.outputs.semver }}-offline.tar.zst.sha256
