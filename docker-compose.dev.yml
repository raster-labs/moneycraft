# ==============================================================================
# MoneyCraft 1.0.0 — Local Developer Compose Overlay (`docker-compose.dev.yml`)
# Binds strictly to `127.0.0.1` on non-conflicting local ports:
#   - Gateway HTTP:  `127.0.0.1:18080 -> 8080`
#   - Gateway HTTPS: `127.0.0.1:18443 -> 8443`
#   - Business PG18: `127.0.0.1:55480 -> 5432`
#   - Authority PG18:`127.0.0.1:55481 -> 5432`
# ==============================================================================

services:
  moneycraft-business-pg18:
    ports:
      - "127.0.0.1:${MC_BUSINESS_DB_PORT:-55480}:5432"

  moneycraft-authority-pg18:
    ports:
      - "127.0.0.1:${MC_AUTHORITY_DB_PORT:-55481}:5432"

  moneycraft-api:
    environment:
      SPRING_PROFILES_ACTIVE: dev
      MC_BASE_URL: https://localhost:${MC_GATEWAY_HTTPS_PORT:-18443}
      MONEYCRAFT_WEBAUTHN_ALLOWEDORIGINS_0: https://localhost:${MC_GATEWAY_HTTPS_PORT:-18443}
      MONEYCRAFT_WEBAUTHN_ALLOWEDORIGINS_1: https://127.0.0.1:${MC_GATEWAY_HTTPS_PORT:-18443}
      MONEYCRAFT_WEBAUTHN_ALLOWEDORIGINS_2: http://localhost:${MC_GATEWAY_HTTP_PORT:-18080}
      MONEYCRAFT_WEBAUTHN_ALLOWEDORIGINS_3: http://127.0.0.1:${MC_GATEWAY_HTTP_PORT:-18080}
      JAVA_TOOL_OPTIONS: "-XX:+UseContainerSupport -XX:InitialRAMPercentage=25.0 -XX:MaxRAMPercentage=65.0 -XX:+UseZGC -XX:+ExitOnOutOfMemoryError -Djava.security.egd=file:/dev/./urandom -Djava.awt.headless=true"

  moneycraft-migrator:
    environment:
      SPRING_PROFILES_ACTIVE: dev,migrator

  moneycraft-ui:
    environment:
      MC_ENV_LABEL: DEV
      MC_RELEASE_VERSION: ${MC_RELEASE_VERSION:-1.0.0-SNAPSHOT}

  moneycraft-gateway:
    ports:
      - "127.0.0.1:${MC_GATEWAY_HTTP_PORT:-18080}:8080"
      - "127.0.0.1:${MC_GATEWAY_HTTPS_PORT:-18443}:8443"
    environment:
      MC_HTTPS_REDIRECT_PORT: ${MC_GATEWAY_HTTPS_PORT:-18443}
      MC_ALLOW_SELF_SIGNED_TLS: "true"
      MC_DEV_ALLOW_HTTP: "true"
