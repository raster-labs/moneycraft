# ==============================================================================
# MoneyCraft 1.0.0 — PostgreSQL 18 Host-Based Authentication (`pg_hba.conf`)
# Enforces `scram-sha-256` exclusively; requires `hostssl` on remote TCP links
# in staging & production (`hostnossl all all 0.0.0.0/0 reject`)
# ==============================================================================

# TYPE  DATABASE        USER                ADDRESS                 METHOD
local   all             all                                         scram-sha-256
host    all             all                 127.0.0.1/32            scram-sha-256
host    all             all                 ::1/128                 scram-sha-256

# Reject unencrypted TCP connections outside loopback in TLS-hardened deployments
hostssl all             mc_flyway_migrator  10.0.0.0/8              scram-sha-256
hostssl all             mc_flyway_migrator  172.16.0.0/12           scram-sha-256
hostssl all             mc_flyway_migrator  192.168.0.0/16          scram-sha-256

hostssl all             mc_app_runtime      10.0.0.0/8              scram-sha-256
hostssl all             mc_app_runtime      172.16.0.0/12           scram-sha-256
hostssl all             mc_app_runtime      192.168.0.0/16          scram-sha-256

hostssl replication     mc_backup_operator  10.0.0.0/8              scram-sha-256
hostssl replication     mc_backup_operator  172.16.0.0/12           scram-sha-256
hostssl replication     mc_backup_operator  192.168.0.0/16          scram-sha-256

hostssl all             mc_backup_operator  10.0.0.0/8              scram-sha-256
hostssl all             mc_backup_operator  172.16.0.0/12           scram-sha-256
hostssl all             mc_backup_operator  192.168.0.0/16          scram-sha-256

hostnossl all           all                 0.0.0.0/0               reject
hostnossl all           all                 ::/0                    reject
