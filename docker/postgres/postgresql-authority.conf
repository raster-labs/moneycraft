# ==============================================================================
# MoneyCraft 1.0.0 — Protected Authority PostgreSQL 18.6 Configuration (`ma_*`)
# Tuned for Argon2id/Passkey/OIDC auth, SPRING_SESSION, Tink DEKs & Receipts
# ==============================================================================

listen_addresses = '*'
port = 5432
max_connections = 150
password_encryption = 'scram-sha-256'

# Memory & Planner
shared_buffers = 256MB
effective_cache_size = 768MB
work_mem = 8MB
maintenance_work_mem = 128MB
random_page_cost = 1.1
effective_io_concurrency = 200

# Strict Durability & WAL Archiving (Synchronized with Business PG18)
fsync = on
synchronous_commit = on
full_page_writes = on
wal_compression = zstd
wal_buffers = 16MB
min_wal_size = 128MB
max_wal_size = 1GB
checkpoint_timeout = 10min
checkpoint_completion_target = 0.9

wal_level = replica
max_wal_senders = 5
max_replication_slots = 5
track_commit_timestamp = on
archive_mode = on
archive_timeout = 60s
archive_command = 'test ! -f /var/lib/postgresql/wal-archive/authority/%f && cp %p /var/lib/postgresql/wal-archive/authority/%f'

# Security & Session Timeouts
deadlock_timeout = 1s
lock_timeout = 5s
statement_timeout = 15s
idle_in_transaction_session_timeout = 30s
log_connections = on
log_disconnections = on
log_lock_waits = on
log_timezone = 'UTC'
timezone = 'UTC'
datestyle = 'iso, mdy'
lc_messages = 'C.UTF-8'
lc_monetary = 'C.UTF-8'
lc_numeric = 'C.UTF-8'
lc_time = 'C.UTF-8'
default_text_search_config = 'pg_catalog.simple'
