# ==============================================================================
# MoneyCraft 1.0.0 — Business Accounting PostgreSQL 18.6 Configuration (`mc_*`)
# Tuned for ACID double-entry posting, synchronous WAL durability, and PITR
# ==============================================================================

listen_addresses = '*'
port = 5432
max_connections = 200
password_encryption = 'scram-sha-256'

# Memory & Query Planner (SSD/NVMe tuned; override via Compose command flags if needed)
shared_buffers = 512MB
effective_cache_size = 1536MB
work_mem = 16MB
maintenance_work_mem = 256MB
random_page_cost = 1.1
effective_io_concurrency = 200

# Strict Crash-Safe Financial Durability & Checkpointing
fsync = on
synchronous_commit = on
full_page_writes = on
wal_compression = zstd
wal_buffers = 16MB
min_wal_size = 256MB
max_wal_size = 2GB
checkpoint_timeout = 10min
checkpoint_completion_target = 0.9

# Replication, Continuous WAL Archiving & Causal-Cut PITR
wal_level = replica
max_wal_senders = 5
max_replication_slots = 5
track_commit_timestamp = on
archive_mode = on
archive_timeout = 60s
archive_command = 'mkdir -p /var/lib/postgresql/wal-archive/business && test ! -f /var/lib/postgresql/wal-archive/business/%f && cp %p /var/lib/postgresql/wal-archive/business/%f'

# Lock-Order & Contention Diagnostics (`MCJ1-TXN-01`)
deadlock_timeout = 1s
lock_timeout = 5s
statement_timeout = 30s
idle_in_transaction_session_timeout = 60s
log_lock_waits = on
log_temp_files = 0
log_min_duration_statement = 500
log_timezone = 'UTC'
timezone = 'UTC'
datestyle = 'iso, mdy'
lc_messages = 'C.UTF-8'
lc_monetary = 'C.UTF-8'
lc_numeric = 'C.UTF-8'
lc_time = 'C.UTF-8'
default_text_search_config = 'pg_catalog.simple'
