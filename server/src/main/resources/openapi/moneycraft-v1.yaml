components:
  securitySchemes:
    SessionCookie:
      type: apiKey
      in: cookie
      name: MCSESSION
    ServiceApiKey:
      type: http
      scheme: bearer
      bearerFormat: mc_sk_<prefix>_<secret>

  parameters:
    CompanyIdPath:
      name: companyId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    RequiredIdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: 90-day RFC 8785 JCS + HMAC-SHA256 idempotency token
      schema:
        type: string
        minLength: 1
        maxLength: 128
    OptionalIdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      schema:
        type: string
        maxLength: 128
    RequiredIfMatch:
      name: If-Match
      in: header
      required: true
      description: Current resource ETag (e.g. "v1")
      schema:
        type: string

  responses:
    ProblemUnauthorized:
      description: Authentication required or invalid credentials
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
    ProblemForbidden:
      description: RBAC authorization denied or immutable MCA Edit Log violation
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
    ProblemConflict:
      description: Resource state conflict or Idempotency-Key payload mismatch
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
    ProblemPreconditionFailed:
      description: Stale ETag / If-Match optimistic concurrency conflict
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
    ProblemQuarantined:
      description: Fail-closed QUARANTINE mode active (MC-SYSTEM-QUARANTINED)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'

  schemas:
    ProblemDetail:
      type: object
      required: [type, title, status, detail, code, errorCode]
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
        code:
          type: string
          example: MC-SYSTEM-QUARANTINED
        errorCode:
          type: string
          example: MC-SYSTEM-QUARANTINED
        fieldErrors:
          type: object
          additionalProperties:
            type: string

    SystemStatusResponse:
      type: object
      required: [securityState, fenceEpoch, version]
      properties:
        securityState:
          type: string
          enum: [UNINITIALISED, ACTIVE, QUARANTINED]
        fenceEpoch:
          type: integer
          format: int64
        version:
          type: string
        quarantineReason:
          type: [string, 'null']

    InitialiseInstallationRequest:
      type: object
      required: [ownerUsername, ownerDisplayName, password]
      properties:
        installationLabel:
          type: string
        ownerUsername:
          type: string
        ownerDisplayName:
          type: string
        password:
          type: string
          minLength: 12

    InitialiseInstallationResponse:
      type: object
      required: [installationId, ownerPrincipal, recoveryReceiptCode]
      properties:
        installationId:
          type: string
          format: uuid
        ownerPrincipal:
          $ref: '#/components/schemas/AuthenticatedPrincipalDto'
        recoveryReceiptCode:
          type: string

    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
        password:
          type: string

    CompanyGrantSummaryDto:
      type: object
      required: [grantId, companyId, roleCode, voucherTypeAllowlist, exportPermitted]
      properties:
        grantId:
          type: string
          format: uuid
        companyId:
          type: string
          format: uuid
        roleCode:
          type: string
          enum:
            - COMPANY_ADMIN
            - AUDITOR_APPROVER
            - SENIOR_ACCOUNTANT
            - DATA_ENTRY_OPERATOR
            - INVENTORY_CLERK
            - READ_ONLY_VIEWER
        voucherTypeAllowlist:
          type: array
          items:
            type: string
        backdatedDaysLimit:
          type: [integer, 'null']
        exportPermitted:
          type: boolean

    AuthenticatedPrincipalDto:
      type: object
      required: [principalId, username, displayName, systemRoles, companyGrants, passkeyEnrolled]
      properties:
        principalId:
          type: string
          format: uuid
        username:
          type: string
        displayName:
          type: string
        systemRoles:
          type: array
          items:
            type: string
            enum: [INSTALLATION_OWNER, SECURITY_AUDITOR, SYSTEM_OPERATOR]
        companyGrants:
          type: array
          items:
            $ref: '#/components/schemas/CompanyGrantSummaryDto'
        passkeyEnrolled:
          type: boolean
        csrfToken:
          type: string

    PasskeyCreationOptionsResponse:
      type: object
      required: [challenge, rp, user, pubKeyCredParams]
      properties:
        challenge:
          type: string
        rp:
          type: object
          properties:
            name:
              type: string
            id:
              type: string
        user:
          type: object
          properties:
            id:
              type: string
            name:
              type: string
            displayName:
              type: string
        pubKeyCredParams:
          type: array
          items:
            type: object
            properties:
              type:
                type: string
              alg:
                type: integer
        timeout:
          type: integer
          format: int64
        attestation:
          type: string
        excludeCredentials:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
              type:
                type: string

    PasskeyRegisterVerifyRequest:
      type: object
      required: [clientDataJSON, attestationObject]
      properties:
        label:
          type: string
        credentialId:
          type: string
        rawId:
          type: string
        type:
          type: string
        clientDataJSON:
          type: string
        attestationObject:
          type: string

    PasskeyRequestOptionsResponse:
      type: object
      required: [challenge]
      properties:
        challenge:
          type: string
        rpId:
          type: string
        timeout:
          type: integer
          format: int64
        userVerification:
          type: string
        allowCredentials:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
              type:
                type: string

