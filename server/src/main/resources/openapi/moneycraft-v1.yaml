openapi: 3.1.0
info:
  title: MoneyCraft 1.0.0 ERP API
  version: 1.0.0
  description: >-
    Clean-room, air-gapped-first multi-company accounting, inventory, and statutory ERP API.
    Enforces Dual-PG18 AuthorityGuard fencing, RFC 8785 JCS + HMAC-SHA256 90-day idempotency,
    ETag/If-Match optimistic concurrency, HS256 keyset pagination, and RFC 9457 ProblemDetail.
servers:
  - url: /api/v1
    description: Versioned MoneyCraft v1 API base path

security:
  - SessionCookie: []
  - ServiceApiKey: []

paths:
  /system/status:
    get:
      operationId: queryInstallationStatus
      tags: [System]
      security: []
      summary: Query installation security state, fence epoch, and version
      responses:
        '200':
          description: Current installation status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemStatusResponse'

  /system/initialise:
    post:
      operationId: executeFirstRunBootstrap
      tags: [System]
      security: []
      summary: Execute one-time first-run installation owner bootstrap ceremony
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InitialiseInstallationRequest'
      responses:
        '201':
          description: Installation initialised and owner session established
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InitialiseInstallationResponse'
        '409':
          $ref: '#/components/responses/ProblemConflict'

  /auth/login:
    post:
      operationId: signInWithArgon2Password
      tags: [Auth]
      security: []
      summary: Authenticate local operator with Argon2id verifier and rotate SPRING_SESSION
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Authenticated operator session and CSRF token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthenticatedPrincipalDto'
        '401':
          $ref: '#/components/responses/ProblemUnauthorized'

  /auth/logout:
    post:
      operationId: signOutCurrentSession
      tags: [Auth]
      summary: Invalidate active SPRING_SESSION and clear XSRF-TOKEN cookie
      responses:
        '204':
          description: Session terminated

  /auth/me:
    get:
      operationId: currentOperatorProfile
      tags: [Auth]
      summary: Fetch authenticated principal profile, system roles, and active MC-OBJECT-1 grants
      responses:
        '200':
          description: Current operator profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthenticatedPrincipalDto'
        '401':
          $ref: '#/components/responses/ProblemUnauthorized'

  /auth/passkeys/register/options:
    post:
      operationId: beginPasskeyEnrollment
      tags: [Passkeys]
      summary: Issue WebAuthn FIDO2 attestation options bound to Protected Authority challenge
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                label:
                  type: string
      responses:
        '200':
          description: WebAuthn PublicKeyCredentialCreationOptions payload
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PasskeyCreationOptionsResponse'

  /auth/passkeys/register/verify:
    post:
      operationId: finishPasskeyEnrollment
      tags: [Passkeys]
      summary: Verify CBOR/COSE WebAuthn attestation and persist passkey in ma_passkey
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasskeyRegisterVerifyRequest'
      responses:
        '204':
          description: Passkey enrolled

  /auth/passkeys/authenticate/options:
    post:
      operationId: beginPasskeyAssertion
      tags: [Passkeys]
      security: []
      summary: Issue WebAuthn FIDO2 assertion options
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                username:
                  type: [string, 'null']
      responses:
        '200':
          description: WebAuthn PublicKeyCredentialRequestOptions payload
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PasskeyRequestOptionsResponse'

  /auth/passkeys/authenticate/verify:
    post:
      operationId: finishPasskeyAssertion
      tags: [Passkeys]
      security: []
      summary: Verify WebAuthn assertion signature and establish authenticated session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasskeyAuthVerifyRequest'
      responses:
        '200':
          description: Authenticated operator session
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthenticatedPrincipalDto'

  /auth/oidc/{issuerId}/authorize:
    get:
      operationId: beginOidcPkceRedirect
      tags: [OIDC]
      security: []
      summary: Generate S256 PKCE authorization redirect URL for enterprise OIDC issuer
      parameters:
        - name: issuerId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: PKCE S256 authorization URL and state nonce
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OidcAuthorizeResponse'

  /auth/oidc/callback:
    post:
      operationId: completeOidcPkceExchange
      tags: [OIDC]
      security: []
      summary: Complete S256 PKCE code exchange and establish authenticated session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OidcCallbackRequest'
      responses:
        '200':
          description: Authenticated operator session
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthenticatedPrincipalDto'

  /admin/principals:
    get:
      operationId: listOperatorPrincipals
      tags: [Administration]
      summary: List Protected Authority principals
      responses:
        '200':
          description: Registered principals
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AdminPrincipalRecordDto'
    post:
      operationId: createOperatorPrincipal
      tags: [Administration]
      summary: Provision new operator principal with Argon2id verifier and Business DB projection
      parameters:
        - $ref: '#/components/parameters/OptionalIdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePrincipalRequest'
      responses:
        '201':
          description: Principal created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminPrincipalRecordDto'

  /admin/principals/{principalRef}/grants:
    put:
      operationId: upsertPrincipalCompanyGrant
      tags: [Administration]
      summary: Assign or update MC-OBJECT-1 company role grant and sync admin receipt mirror
      parameters:
        - name: principalRef
          in: path
          required: true
          schema:
            type: string
        - $ref: '#/components/parameters/OptionalIdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssignCompanyGrantRequest'
      responses:
        '200':
          description: Updated company role grant
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompanyGrantSummaryDto'

  /admin/service-keys:
    post:
      operationId: issueScopedServiceApiKey
      tags: [Administration]
      summary: Issue scoped machine-to-machine API key (mc_sk_<prefix>_<secret>)
      parameters:
        - $ref: '#/components/parameters/OptionalIdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateServiceKeyRequest'
      responses:
        '201':
          description: One-time raw service key token and metadata
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreatedServiceKeyResponse'

  /admin/oidc-issuers:
    get:
      operationId: listEnterpriseOidcIssuers
      tags: [Administration]
      summary: List configured enterprise OIDC issuers
      responses:
        '200':
          description: OIDC issuers
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/OidcIssuerDto'
    post:
      operationId: registerEnterpriseOidcIssuer
      tags: [Administration]
      summary: Register enterprise OIDC issuer with Tink AES256_GCM client secret protection
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOidcIssuerRequest'
      responses:
        '201':
          description: Registered OIDC issuer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OidcIssuerDto'

  /admin/audit/verify:
    get:
      operationId: verifyMcAudit2Chain
      tags: [Administration]
      summary: Verify cryptographic integrity of all MC-AUDIT-2 SHA-256 hash chain streams
      responses:
        '200':
          description: Audit chain verification report
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditChainVerifyResponseDto'

  /admin/quarantine/enter:
    post:
      operationId: enterFailClosedQuarantine
      tags: [Administration]
      summary: Transition installation into fail-closed QUARANTINE DR state
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                reason:
                  type: string
      responses:
        '200':
          description: Updated system status in QUARANTINED mode
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemStatusResponse'

  /admin/quarantine/recover:
    post:
      operationId: recoverFromQuarantineCeremony
      tags: [Administration]
      summary: Reconcile receipts, verify MC-AUDIT-2 chain, and exit QUARANTINE using recovery receipt
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                recoveryReceipt:
                  type: string
                recoveryReceiptCode:
                  type: string
      responses:
        '200':
          description: Installation recovered to ACTIVE writer mode
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemStatusResponse'

  /companies:
    get:
      operationId: listCompanies
      tags: [Companies]
      summary: List companies accessible under caller MC-OBJECT-1 grants
      responses:
        '200':
          description: Accessible companies
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CompanySummaryDto'
    post:
      operationId: createCompany
      tags: [Companies]
      summary: >-
        Create company master (seeding 28 groups, Cash + P&L ledgers, 24 voucher types,
        Main Location godown, 6 TDS natures, and 12 monthly OPEN periods)
      parameters:
        - $ref: '#/components/parameters/RequiredIdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOrUpdateCompanyRequest'
      responses:
        '201':
          description: Created company with ETag "v1"
          headers:
            ETag:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompanySummaryDto'
        '409':
          $ref: '#/components/responses/ProblemConflict'
        '503':
          $ref: '#/components/responses/ProblemQuarantined'

  /companies/{companyId}:
    get:
      operationId: fetchCompanyById
      tags: [Companies]
      summary: Fetch tenant-scoped company configuration and ETag
      parameters:
        - $ref: '#/components/parameters/CompanyIdPath'
      responses:
        '200':
          description: Company details
          headers:
            ETag:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompanySummaryDto'
        '403':
          $ref: '#/components/responses/ProblemForbidden'
    put:
      operationId: alterCompany
      tags: [Companies]
      summary: Alter company & F11 features enforcing If-Match optimistic lock and non-disablable MCA Edit Log
      parameters:
        - $ref: '#/components/parameters/CompanyIdPath'
        - $ref: '#/components/parameters/RequiredIdempotencyKey'
        - $ref: '#/components/parameters/RequiredIfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOrUpdateCompanyRequest'
      responses:
        '200':
          description: Updated company and incremented ETag
          headers:
            ETag:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompanySummaryDto'
        '403':
          $ref: '#/components/responses/ProblemForbidden'
        '412':
          $ref: '#/components/responses/ProblemPreconditionFailed'

  /companies/{companyId}/fiscal-years:
    get:
      operationId: listCompanyFiscalYears
      tags: [FiscalPeriods]
      summary: List tenant-isolated fiscal years and nested monthly accounting periods
      parameters:
        - $ref: '#/components/parameters/CompanyIdPath'
      responses:
        '200':
          description: Fiscal years for company
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/FiscalYearDto'
    post:
      operationId: createCompanyFiscalYear
      tags: [FiscalPeriods]
      summary: Create non-overlapping fiscal year and seed monthly OPEN accounting periods
      parameters:
        - $ref: '#/components/parameters/CompanyIdPath'
        - $ref: '#/components/parameters/RequiredIdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateFiscalYearRequest'
      responses:
        '201':
          description: Created fiscal year
          headers:
            ETag:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FiscalYearDto'

  /companies/{companyId}/periods:
    get:
      operationId: listCompanyAccountingPeriods
      tags: [FiscalPeriods]
      summary: List monthly accounting periods under PostgreSQL 18 RLS isolation
      parameters:
        - $ref: '#/components/parameters/CompanyIdPath'
      responses:
        '200':
          description: Accounting periods
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AccountingPeriodDto'

  /companies/{companyId}/periods/{periodId}:
    patch:
      operationId: changeAccountingPeriodState
      tags: [FiscalPeriods]
      summary: Transition accounting period state between OPEN, SOFT_LOCKED, and CLOSED
      parameters:
        - $ref: '#/components/parameters/CompanyIdPath'
        - name: periodId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: '#/components/parameters/RequiredIdempotencyKey'
        - name: If-Match
          in: header
          required: false
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchPeriodStateRequest'
      responses:
        '200':
          description: Updated accounting period state
          headers:
            ETag:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountingPeriodDto'

  /companies/{companyId}/chart-of-accounts/tree:
    get:
      operationId: getChartOfAccountsTree
      tags: [ChartOfAccounts]
      summary: Full hierarchical tree of 28 predefined + custom account groups and child ledgers
      parameters:
        - $ref: '#/components/parameters/CompanyIdPath'
      responses:
        '200':
          description: Hierarchical Chart of Accounts tree
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChartOfAccountsTreeResponse'

  /companies/{companyId}/account-groups:
    get:
      operationId: listAccountGroups
      tags: [ChartOfAccounts]
      summary: HS256 cursor-paginated account groups
      parameters:
        - $ref: '#/components/parameters/CompanyIdPath'
        - name: cursor
          in: query
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
        - name: q
          in: query
          schema:
            type: string
      responses:
        '200':
          description: Cursor page of account groups
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountGroupCursorPage'
    post:
      operationId: createAccountGroup
      tags: [ChartOfAccounts]
      summary: Create custom account group with MCA Edit Log v1 snapshot
      parameters:
        - $ref: '#/components/parameters/CompanyIdPath'
        - $ref: '#/components/parameters/RequiredIdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOrUpdateAccountGroupRequest'
      responses:
        '201':
          description: Created account group
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountGroupResponse'

  /companies/{companyId}/account-groups/{groupId}:
    get:
      operationId: getAccountGroup
      tags: [ChartOfAccounts]
      parameters:
        - $ref: '#/components/parameters/CompanyIdPath'
        - name: groupId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Account group master
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountGroupResponse'
    put:
      operationId: updateAccountGroup
      tags: [ChartOfAccounts]
      parameters:
        - $ref: '#/components/parameters/CompanyIdPath'
        - name: groupId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: '#/components/parameters/RequiredIdempotencyKey'
        - $ref: '#/components/parameters/RequiredIfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOrUpdateAccountGroupRequest'
      responses:
        '200':
          description: Updated account group
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountGroupResponse'
    delete:
      operationId: deleteAccountGroup
      tags: [ChartOfAccounts]
      parameters:
        - $ref: '#/components/parameters/CompanyIdPath'
        - name: groupId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: '#/components/parameters/RequiredIdempotencyKey'
      responses:
        '204':
          description: Account group deleted

  /companies/{companyId}/ledgers:
    get:
      operationId: listLedgers
      tags: [Ledgers]
      summary: HS256 cursor-paginated accounting ledgers
      parameters:
        - $ref: '#/components/parameters/CompanyIdPath'
        - name: cursor
          in: query
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
        - name: q
          in: query
          schema:
            type: string
        - name: groupId
          in: query
          schema:
            type: string
            format: uuid
        - name: taxType
          in: query
          schema:
            type: string
      responses:
        '200':
          description: Cursor page of ledgers
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LedgerCursorPage'
    post:
      operationId: createLedger
      tags: [Ledgers]
      summary: Create accounting ledger with SIV/GCM PII protection and Mod-36 GSTIN validation
      parameters:
        - $ref: '#/components/parameters/CompanyIdPath'
        - $ref: '#/components/parameters/RequiredIdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOrUpdateLedgerRequest'
      responses:
        '201':
          description: Created ledger
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LedgerResponse'

  /companies/{companyId}/ledgers/typeahead:
    get:
      operationId: typeaheadLedgers
      tags: [Ledgers]
      summary: Sub-15ms indexed ledger typeahead for voucher entry grids
      parameters:
        - $ref: '#/components/parameters/CompanyIdPath'
        - name: q
          in: query
          schema:
            type: string
        - name: filter
          in: query
          schema:
            type: string
            enum: [ALL, CASH_BANK, PARTY, SALES, PURCHASE, DUTIES_TAXES, NON_CASH_BANK, EXPENSE_INCOME]
        - name: limit
          in: query
          schema:
            type: integer
      responses:
        '200':
          description: Matching ledger typeahead items
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/LedgerTypeaheadResponse'

  /companies/{companyId}/ledgers/{ledgerId}:
    get:
      operationId: getLedger
      tags: [Ledgers]
      parameters:
        - $ref: '#/components/parameters/CompanyIdPath'
        - name: ledgerId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Ledger master
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LedgerResponse'
    put:
      operationId: updateLedger
      tags: [Ledgers]
      parameters:
        - $ref: '#/components/parameters/CompanyIdPath'
        - name: ledgerId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: '#/components/parameters/RequiredIdempotencyKey'
        - $ref: '#/components/parameters/RequiredIfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOrUpdateLedgerRequest'
      responses:
        '200':
          description: Updated ledger
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LedgerResponse'
    delete:
      operationId: deleteLedger
      tags: [Ledgers]
      parameters:
        - $ref: '#/components/parameters/CompanyIdPath'
        - name: ledgerId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: '#/components/parameters/RequiredIdempotencyKey'
      responses:
        '204':
          description: Ledger deleted

  /companies/{companyId}/currencies:
    get:
      operationId: listCurrencies
      tags: [Currencies]
      parameters:
        - $ref: '#/components/parameters/CompanyIdPath'
      responses:
        '200':
          description: Company currencies
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CurrencyResponse'
    post:
      operationId: createCurrency
      tags: [Currencies]
      parameters:
        - $ref: '#/components/parameters/CompanyIdPath'
        - $ref: '#/components/parameters/RequiredIdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOrUpdateCurrencyRequest'
      responses:
        '201':
          description: Created currency
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrencyResponse'

  /companies/{companyId}/currencies/{currencyId}:
    get:
      operationId: getCurrency
      tags: [Currencies]
      parameters:
        - $ref: '#/components/parameters/CompanyIdPath'
        - name: currencyId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Currency details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrencyResponse'
    put:
      operationId: updateCurrency
      tags: [Currencies]
      parameters:
        - $ref: '#/components/parameters/CompanyIdPath'
        - name: currencyId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: '#/components/parameters/RequiredIdempotencyKey'
        - $ref: '#/components/parameters/RequiredIfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOrUpdateCurrencyRequest'
      responses:
        '200':
          description: Updated currency
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrencyResponse'

  /companies/{companyId}/currencies/{currencyId}/rates:
    get:
      operationId: listForexRates
      tags: [Currencies]
      parameters:
        - $ref: '#/components/parameters/CompanyIdPath'
        - name: currencyId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Date-effective forex rates
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ForexRateResponse'
    post:
      operationId: upsertForexRate
      tags: [Currencies]
      parameters:
        - $ref: '#/components/parameters/CompanyIdPath'
        - name: currencyId
          in: path
          required: true
          schema:
            type: string
            format: uuid
