# ==============================================================================
# MoneyCraft 1.0.0 — Unprivileged Nginx SPA Server Configuration (`:8080`)
# Enforces Gzip + Brotli static/dynamic compression, SPA fallback, cache split,
# and per-request `$request_id` CSP nonce injection (`__MC_CSP_NONCE__`).
# ==============================================================================

load_module /usr/lib/nginx/modules/ngx_http_brotli_filter_module.so;
load_module /usr/lib/nginx/modules/ngx_http_brotli_static_module.so;

worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    types {
        font/woff2                 woff2;
        application/manifest+json  webmanifest;
    }

    server_tokens off;
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;

    client_body_temp_path /var/cache/nginx/client_temp;
    proxy_temp_path       /var/cache/nginx/proxy_temp;
    fastcgi_temp_path     /var/cache/nginx/fastcgi_temp;
    uwsgi_temp_path       /var/cache/nginx/uwsgi_temp;
    scgi_temp_path        /var/cache/nginx/scgi_temp;

    # Pre-compressed (.br / .gz) static delivery + dynamic fallback
    gzip on;
    gzip_static on;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_vary on;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/manifest+json
        image/svg+xml;

    brotli on;
    brotli_static on;
    brotli_comp_level 5;
    brotli_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/manifest+json
        image/svg+xml;

    log_format main '$remote_addr - [$time_local] "$request" $status $body_bytes_sent req_id=$request_id';
    access_log /dev/stdout main;

    server {
        listen 8080;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;

        set $csp_nonce $request_id;
        sub_filter_once off;
        sub_filter_types text/html;
        sub_filter '__MC_CSP_NONCE__' $csp_nonce;

        include /etc/nginx/security-headers.conf;

        location = /healthz {
            access_log off;
            default_type text/plain;
            return 200 "OK\n";
        }

        location = /index.html {
            gzip_static off;
            brotli_static off;
            include /etc/nginx/security-headers.conf;
            add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        }

        location = /assets/config/runtime-config.json {
            gzip_static off;
            brotli_static off;
            include /etc/nginx/security-headers.conf;
            add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        }

        location ~* \.(?:js|css|woff2|ttf|svg|png|ico|webmanifest)$ {
            include /etc/nginx/security-headers.conf;
            add_header Cache-Control "public, max-age=31536000, immutable" always;
            try_files $uri =404;
        }

        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
