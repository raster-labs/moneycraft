# ==============================================================================
# MoneyCraft 1.0.0 — Strict Per-Request CSP Nonce & Browser Hardening Headers
# Zero `'unsafe-inline'`; binds `<app-root ngCspNonce="$csp_nonce">` to `$request_id`
# ==============================================================================

add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'nonce-$csp_nonce'; style-src 'self' 'nonce-$csp_nonce'; font-src 'self'; img-src 'self' data: blob:; connect-src 'self' https: http:; frame-ancestors 'none'; object-src 'none'; base-uri 'self'; form-action 'self'" always;
add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
